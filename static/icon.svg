<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Piller app icon: simplified medicine cabinet from the login illustration.
       Full-bleed background so it also works as a maskable icon; all content
       stays inside the central safe zone (radius ~205px). -->
  <rect width="512" height="512" fill="#E3EEE9"/>
  <g fill="none" stroke="#1D6B57" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <!-- cabinet -->
    <rect x="146" y="96" width="220" height="320" rx="18" fill="#FFFFFF"/>

    <!-- top shelf -->
    <rect x="174" y="128" width="32" height="14" rx="3" fill="#1D6B57"/>
    <rect x="166" y="142" width="48" height="54" rx="8" fill="#FFFFFF"/>
    <rect x="226" y="136" width="50" height="60" rx="4" fill="#CFE3DA"/>
    <rect x="300" y="120" width="18" height="14" rx="2" fill="#1D6B57"/>
    <rect x="292" y="134" width="34" height="62" rx="9" fill="#CFE3DA"/>
    <path d="M146 196H366"/>

    <!-- middle shelf: first-aid box -->
    <rect x="172" y="226" width="110" height="80" rx="8" fill="#FFFFFF"/>
    <rect x="219" y="241" width="16" height="50" rx="2" fill="#1D6B57" stroke="none"/>
    <rect x="202" y="258" width="50" height="16" rx="2" fill="#1D6B57" stroke="none"/>
    <rect x="302" y="240" width="30" height="12" rx="3" fill="#1D6B57"/>
    <rect x="296" y="252" width="42" height="54" rx="8" fill="#FFFFFF"/>
    <path d="M146 306H366"/>

    <!-- bottom shelf -->
    <rect x="172" y="346" width="52" height="70" rx="4" fill="#CFE3DA"/>
    <rect x="238" y="336" width="50" height="80" rx="5" fill="#CFE3DA"/>
    <circle cx="254" cy="358" r="7" fill="#FFFFFF" stroke-width="6"/>
    <circle cx="272" cy="358" r="7" fill="#FFFFFF" stroke-width="6"/>
    <circle cx="254" cy="384" r="7" fill="#FFFFFF" stroke-width="6"/>
    <circle cx="272" cy="384" r="7" fill="#FFFFFF" stroke-width="6"/>
    <rect x="306" y="354" width="24" height="10" rx="2" fill="#1D6B57"/>
    <rect x="300" y="364" width="36" height="52" rx="8" fill="#FFFFFF"/>

    <!-- redraw cabinet outline on top so shelf items sit cleanly inside -->
    <rect x="146" y="96" width="220" height="320" rx="18"/>
  </g>
</svg>
